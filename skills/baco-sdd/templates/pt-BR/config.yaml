# Configuração do BACO-SDD neste projeto.
# Copie para `.baco/config.yaml`. Tudo aqui é opcional: o que você apagar volta ao valor padrão.
# Regras do arquivo: use só espaços (nada de tabulação), comentários começam com "#" e "on" liga, "off" desliga.

language: pt-BR           # idioma dos documentos e das perguntas

tracker: [files]          # onde ficam registradas as tarefas: "files" = arquivos em docs/
                          # para registrar também no GitHub, escreva: tracker: [files, github]

# Quadro do GitHub (GitHub Project) mantido em dia com as tarefas, só com github em tracker.
# Cada card muda de coluna quando a tarefa é publicada, começa, vai para revisão e é juntada.
# Os arquivos da entrega continuam valendo; o quadro só recebe as mudanças.
# github:
#   project:
#     owner: <dono do quadro, usuário ou organização>
#     number: <número do quadro>
#     field: Status           # nome do campo de etapa do quadro
#     status: {published: Backlog, started: In progress, review: In review, merged: Done}

branches:
  main: main              # a branch principal, onde só entra o que foi aprovado
  integration: develop    # a branch onde as entregas se juntam antes da principal
  protected: [main, master, develop]   # branches que ninguém edita direto

parallel: 3               # quantas tarefas podem andar ao mesmo tempo; 0 = uma de cada vez

# Pontos em que o trabalho para e espera uma pessoa aprovar. "on" = para, "off" = segue sozinho.
# Três paradas nunca desligam, mesmo que você escreva "off": aprovação da spec,
# ação sem volta (apagar dados, publicar em produção) e junção na branch principal. Estão sempre ligadas.
gates:
  project_start: on       # antes de começar um projeto novo
  architecture: on        # antes de seguir com a arquitetura proposta
  plan: on                # antes de executar o plano da entrega
  task_batch: on          # antes de soltar o lote de tarefas
  each_task: off          # depois de cada tarefa (desligado: as tarefas rodam sozinhas entre as paradas)
  before_pr: on           # antes de marcar o pedido de junção (PR) como pronto para juntar
                          # (o rascunho aberto para a revisão não é pedido de junção)

# O que fazer quando um cenário manual ainda não foi executado por uma pessoa.
# "block" = não deixa juntar; "warn" = avisa e deixa seguir.
#   A regra vale pelo destino da entrega (veja "delivery"): "integration" é a branch de integração,
#   "main" a principal. Cenário que só um especialista faz ("qa") nunca entra aqui nem bloqueia.
manual_pending:
  main: block             # na branch principal: bloqueia
  "*": warn               # em develop e em qualquer outra branch: só avisa
  # integration: warn     # só se a branch de integração tiver uma regra diferente das demais

# Comandos que rodam os testes. Cada comando precisa gravar o próprio relatório JUnit
# dentro da pasta .baco/junit; sem esse arquivo, os testes contam como "não rodaram".
# Os dois abaixo são só exemplos: troque pelos comandos do seu projeto.
tests:
  unit: "npx vitest run --reporter=junit --outputFile=.baco/junit/unit.xml"   # testes das regras e funções
  e2e_web: "PLAYWRIGHT_JUNIT_OUTPUT_FILE=.baco/junit/e2e-web.xml npx playwright test --reporter=junit"   # testes do site no navegador
  # Baterias que nunca rodam ao mesmo tempo nesta máquina, nem vindas de projetos diferentes:
  # uma espera a outra terminar. Sem esta linha, entram na fila as camadas cujo nome começa com "e2e".
  # queue: [e2e_web]

# Versão rápida dos comandos, usada durante as tarefas (baco run-tests --quick): por exemplo,
# só um navegador. A bateria completa, com todos os navegadores, roda uma vez no fim da entrega.
# Camada sem versão rápida usa o comando de "tests".
tests_quick:
  e2e_web: "PLAYWRIGHT_JUNIT_OUTPUT_FILE=.baco/junit/e2e-web.xml npx playwright test --project=chromium --reporter=junit"   # só no Chromium

# Teste de fumaça: um comando que sobe o sistema do jeito que a pessoa sobe, confere que ele
# responde e encerra (0 = ok). Não pode fazer perguntas na tela. Roda com baco run-tests --smoke.
app:
  # smoke: "npm run smoke"

# Quanta capacidade de IA cada tipo de tarefa recebe, e com quanto esforço.
# Nível (level) em palavras simples:
#   forte = o modelo mais capaz do ambiente (mais caro e mais lento)
#   medio = o modelo intermediário
#   leve  = o mais rápido e barato
# Esforço (effort): alto, medio ou baixo = quanto a IA pensa antes de responder.
# O nome real do modelo depende da ferramenta que você usa; aqui só se escolhe o nível.
# (O formato antigo, com "model: opus|sonnet|haiku" e "effort: high|medium|low", ainda funciona.)
models:
  mechanical: { level: leve, effort: baixo }    # tarefa mecânica: troca simples
  standard: { level: medio, effort: medio }     # tarefa padrão: trabalho comum
  risky: { level: forte, effort: medio }        # tarefa arriscada: dados, login, dinheiro

# Ferramentas de IA (harness) que este projeto usa, e qual modelo de cada uma corresponde a cada nível.
# O agente principal lista os modelos de uma ferramenta nova e recomenda o nível de cada um; você aprova.
# O plano de cada entrega escolhe, entre estas, a ferramenta, o modelo e o esforço de cada tarefa e papel.
# "implementers: on" deixa a ferramenta construir tarefas mesmo quando não é a do agente principal;
# sem isso (padrão off), ela só faz papéis que leem e revisam, sem mexer no código.
# "sandbox" diz o quanto ela é livre quando constrói: protegida (grava só na pasta da tarefa, sem
# internet), rede (a mesma pasta, com internet e porta local; padrão) ou livre (sem caixa, só as regras
# de comando do BACO).
# Um modelo pode ser escrito como família (um nome que aparece nos nomes dos modelos, como sol, terra,
# luna ou neon): o plano de cada entrega usa a versão mais nova dela que a ferramenta lista.
# Um nome exato também vale.
# Modelo que só existe nesta máquina não entra aqui: fica nas configurações da própria ferramenta.
harnesses:
  claude-code:
    models: { forte: opus, medio: sonnet, leve: haiku }
    implementers: on
  # codex:
  #   models: { forte: sol, medio: terra, leve: luna }   # famílias de exemplo
  #   implementers: off
  #   sandbox: rede
  # antigravity:
  #   models: { forte: neon, medio: neon, leve: neon }   # família de exemplo
  #   implementers: off
  #   sandbox: protegida   # protegida (padrão), rede (libera npm, npx e node) ou livre (sem trava de gravação)
  # opencode:
  #   models: { forte: <provedor/modelo>, medio: <provedor/modelo>, leve: <provedor/modelo> }
  #   implementers: off
  # Uma ferramenta com modelos de outra empresa (o Antigravity tem Gemini e Claude) pode ter um
  # perfil por família, cada um com os próprios níveis; "tool" diz qual programa o perfil chama.
  # antigravity-claude:
  #   tool: antigravity
  #   models: { forte: claude-opus-5-5, medio: claude-sonnet-5-5, leve: claude-sonnet-5-5 }
  #   implementers: off
  #   sandbox: protegida

# Como o plano divide as tarefas.
#   funcionalidade = cada tarefa entrega uma funcionalidade inteira, servidor e tela juntos (padrão).
#   front-back = cada funcionalidade vira tarefas separadas de back-end (servidor, banco, API) e de
#     front-end (telas): primeiro o contrato da API, depois back-end e front-end em paralelo. Serve
#     para pôr uma ferramenta de IA no back-end e outra no front-end (veja "roles").
# O plano de cada entrega mostra a divisão, e você pode mudar só para aquela entrega ao aprovar.
planning:
  task_split: funcionalidade
  # O que conta como tarefa arriscada ou mecânica neste projeto, com as suas palavras e exemplos.
  # Tudo o mais é padrão. Sem isto, vale o critério genérico do método.
  # risk:
  #   arriscada: "login, permissão, separação entre clientes, dado pessoal cifrado, migração com dados"
  #   mecanica: "texto de tela, estilo, renomear sem mudar comportamento"
  # Acima destes limites, o plano propõe dividir a entrega em duas.
  # max_tasks: 8
  # max_criteria: 60
  # Depois que o plano é aprovado, uma mudança de spec vai para a próxima entrega, a não ser que você decida trazê-la.
  # freeze_specs: true

# Quem faz cada papel, em ordem de preferência: o nome de uma ferramenta de "harnesses", ou
# ferramenta/modelo para fixar um modelo. Se a cota de uma acabar, a seguinte continua o trabalho.
# Sem um papel aqui, o plano decide como sempre (a ferramenta em que o BACO roda, pelo tipo da tarefa).
# Papéis: implementer (quem constrói, com task_split: funcionalidade), backend e frontend (com
# front-back), task_reviewer (revisões de tarefa), task_reviewer_last (só a última revisão permitida
# da tarefa), final_reviewer (revisão final da entrega) e pr_reviewer (revisão do PR).
# O plano mostra essas listas e você pode mudar qualquer uma, e o modelo de cada papel, ao aprovar.
# A conversa principal (o condutor) não entra aqui: quando a conta dela acaba, quem continua é a
# troca de contas do ambiente, como a fila de contas da Ratoeira.
roles:
  # backend: [antigravity-claude, claude-code]
  # frontend: [antigravity]
  # task_reviewer: [codex, antigravity/gemini-4-argon]
  # task_reviewer_last: [antigravity/gemini-4-argon]

review:
  external_rounds_max: 3  # quantas rodadas de revisão externa antes de pedir decisão a uma pessoa
  # Revisão final interna: roda inteira uma vez e depois no máximo (N-1) rodadas só do que as correções
  # mudaram. Passando disso, o que não for crítico vira pendência; um crítico espera você.
  # final_rounds_max: 2
  # O que as revisões procuram. "always": achado grave se aparecer. "suggestion": caso raro que só vira
  # sugestão, a não ser que toque um item de "always". Listas de frases curtas.
  # focus:
  #   always: ["login", "permissão", "dado de outro cliente", "dado pessoal à mostra"]
  #   suggestion: ["concorrência de milissegundos", "virada da meia-noite", "resposta perdida depois de gravar"]
  # Máximo de revisões de cada tarefa, por tipo, contando a primeira (3 = a primeira e mais duas,
  # depois de cada correção). É a sugestão do plano de cada entrega, que você pode mudar ao aprovar
  # o plano. Só a correção antes da última revisão usa um nível de IA acima.
  task_rounds: { mechanical: 2, standard: 3, risky: 4 }
  # Tarefa que chega à última revisão ainda com achados "importante" abertos:
  # seguir = junta a tarefa, cada achado vira pendência e você decide todos numa lista antes da revisão final;
  # parar = a tarefa espera você. Achado "crítico" aberto sempre para a tarefa.
  last_round_importante: seguir
  # Revisão do pedido de junção (PR) da entrega, ao fim da construção.
  pr:
    reviewer: agente      # quem revisa: agente (outra IA), pessoa, ou ambos (a IA primeiro, depois a pessoa)
    auto_fix: on          # on = os achados viram tarefas de correção que rodam sozinhas no mesmo PR

# Arquivos que não contam como mudança de código para o aceite.
# Normalmente, qualquer commit fora de docs/entregas/ depois dos testes ou da revisão faz o aceite
# pedir tudo de novo, porque o código pode ter mudado. Liste aqui arquivos que mudam sozinhos e não
# são código, como um registro de trabalho ou logs, para que um commit só neles não atrapalhe.
# Aceita "*" e "**" (qualquer pasta dentro). Não ponha aqui código, testes nem specs.
provenance:
  # ignore: [docs/registro-da-rodada.md, "logs/**"]

# Onde rodam os testes além das tarefas.
# test_runs:
#   screen_task_full: false   # true = a tarefa que muda uma tela roda os testes dela em todos os navegadores, uma vez, antes de ser juntada
#   ci_full: merge            # merge = a bateria completa roda no CI a cada junção na integração; manual = só quando alguém dispara
#                             # (o CI roda a rápida no PR e na junção, e a completa fica para antes de promover para a principal)

# Minutos por mês do plano de CI do GitHub (só para repositório privado), para a estimativa do plano.
# ci:
#   monthly_minutes: 2000

# Onde a entrega termina e se a junção na integração acontece sem perguntar.
# Juntar na principal sempre pergunta, mesmo com "auto".
# delivery:
#   target: integration       # integration (padrão) ou main
#   integration_merge: ask    # ask (padrão) ou auto: com auto, se o "baco merge-check" disser que está tudo certo, junta sem perguntar

# Tipos de cenário manual que só um QA especialista executa. Nunca são pedidos a você, nunca bloqueiam
# uma junção (nem na principal) e ficam como pendência do especialista.
# qa:
#   specialist: ["leitor de tela"]

# O sistema chama um modelo de IA (por exemplo para resumir, classificar ou responder)? Com on, a
# arquitetura, as specs, o plano e as revisões tratam a injeção de instruções em texto de fora.
# product:
#   uses_ai: off              # on = o sistema usa IA; o método também liga quando uma spec ou ADR traz IA

# Tamanho da conversa. Conversa muito longa fica mais cara a cada passo e lembra pior dos detalhes;
# como o estado do trabalho fica salvo nos arquivos, continuar numa conversa nova custa pouco.
context:
  handoff_at: 290000   # a partir de quantos tokens de contexto sugerir continuar numa conversa nova
                       # (feito para autoCompactWindow: 400000 nas configurações do seu Claude Code)
  auto_handoff: off    # on = durante a construção, trocar de conversa sem perguntar

